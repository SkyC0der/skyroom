openapi: 3.1.0
info:
  title: Skyroom HTTP API
  version: 0.1.0
  description: The versioned HTTP contract shared by the Go application and TypeScript client.
servers:
  - url: /api/v1
paths:
  /auth/codes:
    post:
      operationId: requestAuthenticationCode
      summary: Send a six-digit email verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailCodeRequest"
      responses:
        "202":
          description: The request was accepted and a code was sent.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: A code was requested too recently.
          headers:
            Retry-After:
              schema:
                type: integer
        "502":
          description: The email provider could not accept the message.
  /auth/verify:
    post:
      operationId: verifyAuthenticationCode
      summary: Verify an email code and establish a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailCodeVerification"
      responses:
        "200":
          description: The code was valid. A session cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The code is invalid, expired, or already used.
        "429":
          description: The verification challenge has been locked.
  /auth/session:
    get:
      operationId: getAuthenticationSession
      summary: Restore the current session and roll its expiry forward
      responses:
        "200":
          description: The session is active.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUser"
        "401":
          description: The session is absent, expired, or revoked.
    delete:
      operationId: revokeAuthenticationSession
      summary: Revoke the current session and clear its cookie
      responses:
        "204":
          description: The current session is no longer active.
  /users/me/handle:
    put:
      operationId: setCurrentUserHandle
      summary: Claim or change the current User's unique global Handle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandleClaim"
      responses:
        "200":
          description: The Handle was saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The session is absent, expired, or revoked.
        "403":
          description: A fresh email verification is required.
        "409":
          description: The normalized Handle is already claimed.
  /communities:
    get:
      operationId: listCommunities
      summary: List Communities joined by the current User
      responses:
        "200":
          description: Accessible Communities.
          content:
            application/json:
              schema:
                type: object
                required: [communities]
                properties:
                  communities:
                    type: array
                    items:
                      $ref: "#/components/schemas/Community"
        "401":
          description: Authentication is required.
    post:
      operationId: createCommunity
      summary: Atomically create a Community and its default structure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityCreate"
      responses:
        "201":
          description: The Community, owner membership, system Roles, and general Room were created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedCommunity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Authentication is required.
        "409":
          description: A Handle is required or the ownership limit was reached.
  /communities/{community_id}/rooms:
    get:
      operationId: listCommunityRooms
      summary: List Rooms visible to the current member
      parameters:
        - $ref: "#/components/parameters/CommunityID"
      responses:
        "200":
          description: Rooms covered by the member's effective View Room capability.
          content:
            application/json:
              schema:
                type: object
                required: [rooms]
                properties:
                  rooms:
                    type: array
                    items:
                      $ref: "#/components/schemas/Room"
        "401":
          description: Authentication is required.
    post:
      operationId: createCommunityRoom
      summary: Create a members-only text Room
      parameters:
        - $ref: "#/components/parameters/CommunityID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomCreate"
      responses:
        "201":
          description: Room created with a durable audit event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Authentication is required.
        "403":
          description: The current member lacks Create Room.
        "409":
          description: The Room name is taken or the Community quota was reached.
  /communities/{community_id}/invitations:
    post:
      operationId: createCommunityInvitation
      summary: Create a seven-day multi-use Community invitation
      parameters:
        - $ref: "#/components/parameters/CommunityID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreate"
      responses:
        "201":
          description: The invitation was created. Its token is returned only here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "401":
          description: Authentication is required.
        "403":
          description: Only the Community owner may create invitations initially.
  /communities/{community_id}/invitations/{invitation_id}:
    delete:
      operationId: revokeCommunityInvitation
      summary: Revoke an active invitation
      parameters:
        - $ref: "#/components/parameters/CommunityID"
        - name: invitation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The invitation was revoked.
        "401":
          description: Authentication is required.
        "403":
          description: The current User cannot revoke this invitation.
  /invitations/{token}:
    get:
      operationId: previewCommunityInvitation
      summary: Preview an active invitation before joining
      parameters:
        - $ref: "#/components/parameters/InvitationToken"
      responses:
        "200":
          description: Public Community and inviter details for the invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "404":
          description: The invitation token is invalid.
        "410":
          description: The invitation expired, was revoked, or reached its use limit.
  /invitations/{token}/join:
    post:
      operationId: joinCommunityInvitation
      summary: Idempotently join the invited Community
      parameters:
        - $ref: "#/components/parameters/InvitationToken"
      responses:
        "200":
          description: Membership exists and includes the Everyone Role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResult"
        "401":
          description: Authentication is required.
        "409":
          description: A global Handle must be claimed first.
        "410":
          description: The invitation expired, was revoked, or reached its use limit.
  /rooms/{room_id}/messages:
    get:
      operationId: listRoomMessages
      summary: Read an authorized page of durable Room Messages
      parameters:
        - $ref: "#/components/parameters/RoomID"
        - name: before
          in: query
          description: Return Messages older than this exclusive Conversation cursor.
          schema:
            type: string
        - name: after
          in: query
          description: Return Messages newer than this exclusive Conversation cursor for gap recovery.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Messages ordered from oldest to newest within the page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageHistoryPage"
        "400":
          description: The cursor or limit is invalid.
        "401":
          description: Authentication is required.
        "403":
          description: The current User cannot view the Room.
    post:
      operationId: postRoomMessage
      summary: Durably post a plain-text Room Message and outbox event
      parameters:
        - $ref: "#/components/parameters/RoomID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageCreate"
      responses:
        "201":
          description: The Message and its outbox event committed atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePostResult"
        "200":
          description: An idempotent retry returned the previously committed Message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePostResult"
        "400":
          description: The body or client idempotency key is invalid.
        "401":
          description: Authentication is required.
        "403":
          description: The current User cannot send Messages in the Room.
        "409":
          description: The idempotency key was reused with different Message content.
  /rooms/{room_id}/events:
    get:
      operationId: subscribeRoomEvents
      summary: Upgrade to an authorized WebSocket stream of committed Room events
      description: Clients recover any delivery gap through the Message history endpoint using the event cursor.
      parameters:
        - $ref: "#/components/parameters/RoomID"
      responses:
        "101":
          description: The connection was upgraded. Events conform to contracts/events/message.created.schema.json.
        "401":
          description: Authentication is required.
        "403":
          description: The current User cannot view the Room.
  /rooms/{room_id}/read-state:
    get:
      operationId: getRoomReadState
      summary: Get the current Member's durable Room read cursor and unread count
      parameters:
        - $ref: "#/components/parameters/RoomID"
      responses:
        "200":
          description: The current read state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomReadState"
        "401":
          description: Authentication is required.
        "403":
          description: The current User cannot view the Room.
    put:
      operationId: markRoomRead
      summary: Advance the current Member's durable Room read cursor
      parameters:
        - $ref: "#/components/parameters/RoomID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [last_message_id]
              properties:
                last_message_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: The advanced read state. Older cursors never move it backward.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomReadState"
        "400":
          description: The Message does not belong to this Room.
        "401":
          description: Authentication is required.
        "403":
          description: The current User cannot view the Room.
  /health:
    get:
      operationId: getHealth
      summary: Report application readiness
      responses:
        "200":
          description: The application is ready to serve requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/live:
    get:
      operationId: getLiveness
      summary: Report process liveness
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: alive
  /metrics:
    get:
      operationId: getServiceMetrics
      summary: Report aggregate HTTP request, latency, and error counters
      responses:
        "200":
          description: Process-local counters for basic operational monitoring.
          content:
            application/json:
              schema:
                type: object
                required: [requests_total, client_errors_total, server_errors_total, request_duration_microseconds_total]
                properties:
                  requests_total:
                    type: integer
                    minimum: 0
                  client_errors_total:
                    type: integer
                    minimum: 0
                  server_errors_total:
                    type: integer
                    minimum: 0
                  request_duration_microseconds_total:
                    type: integer
                    minimum: 0
components:
  parameters:
    CommunityID:
      name: community_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoomID:
      name: room_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 43
  responses:
    BadRequest:
      description: The request body or one of its fields is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    EmailCodeRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    EmailCodeVerification:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        code:
          type: string
          pattern: "^[0-9]{6}$"
    HandleClaim:
      type: object
      additionalProperties: false
      required: [handle]
      properties:
        handle:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9][A-Za-z0-9._]{1,30}[A-Za-z0-9]$"
    CommunityCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: string
          maxLength: 500
          default: ""
    Community:
      type: object
      required: [id, owner_user_id, general_room_id, name, description, member_count, created_at]
      properties:
        id:
          type: string
          format: uuid
        owner_user_id:
          type: string
          format: uuid
        general_room_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        member_count:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
    Member:
      type: object
      required: [id, community_id, user_id, handle, joined_at]
      properties:
        id:
          type: string
          format: uuid
        community_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        handle:
          type: string
        joined_at:
          type: string
          format: date-time
    Room:
      type: object
      required: [id, community_id, name, kind, visibility, created_at]
      properties:
        id:
          type: string
          format: uuid
        community_id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          const: text
        visibility:
          type: string
          const: members
        created_at:
          type: string
          format: date-time
    RoomCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
    CreatedCommunity:
      type: object
      required: [community, membership, general_room]
      properties:
        community:
          $ref: "#/components/schemas/Community"
        membership:
          $ref: "#/components/schemas/Member"
        general_room:
          $ref: "#/components/schemas/Room"
    InvitationCreate:
      type: object
      additionalProperties: false
      properties:
        max_uses:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 10000
            - type: "null"
    Invitation:
      type: object
      required: [id, community_id, token, expires_at, max_uses, uses_count, created_at]
      properties:
        id:
          type: string
          format: uuid
        community_id:
          type: string
          format: uuid
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        max_uses:
          oneOf:
            - type: integer
            - type: "null"
        uses_count:
          type: integer
        revoked_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    InvitationPreview:
      type: object
      required: [community_id, community_name, community_description, member_count, inviter_handle, expires_at]
      properties:
        community_id:
          type: string
          format: uuid
        community_name:
          type: string
        community_description:
          type: string
        member_count:
          type: integer
        inviter_handle:
          type: string
        expires_at:
          type: string
          format: date-time
    JoinResult:
      type: object
      required: [community, membership, already_member]
      properties:
        community:
          $ref: "#/components/schemas/Community"
        membership:
          $ref: "#/components/schemas/Member"
        already_member:
          type: boolean
    MessageCreate:
      type: object
      additionalProperties: false
      required: [client_idempotency_key, body]
      properties:
        client_idempotency_key:
          type: string
          minLength: 8
          maxLength: 100
          pattern: "^[A-Za-z0-9_-]+$"
        body:
          type: string
          minLength: 1
          maxLength: 4000
    Message:
      type: object
      required: [id, community_id, room_id, author_user_id, author_handle, client_idempotency_key, body, revision, created_at]
      properties:
        id:
          type: string
          format: uuid
        community_id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        author_user_id:
          type: string
          format: uuid
        author_handle:
          type: string
        client_idempotency_key:
          type: string
        body:
          type: string
        revision:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
    MessagePostResult:
      type: object
      required: [message, duplicate]
      properties:
        message:
          $ref: "#/components/schemas/Message"
        duplicate:
          type: boolean
    MessageHistoryPage:
      type: object
      required: [messages, has_more_before, has_more_after]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        oldest_cursor:
          type: string
        latest_cursor:
          type: string
        has_more_before:
          type: boolean
        has_more_after:
          type: boolean
    RoomReadState:
      type: object
      required: [unread_count]
      properties:
        last_read_message_id:
          type: string
          format: uuid
        cursor:
          type: string
        unread_count:
          type: integer
          minimum: 0
    AuthenticatedUser:
      type: object
      required: [user, needs_handle]
      properties:
        user:
          $ref: "#/components/schemas/User"
        needs_handle:
          type: boolean
    User:
      type: object
      required: [id, email, handle, email_verified_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        handle:
          oneOf:
            - type: string
            - type: "null"
        email_verified_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Health:
      type: object
      required: [status, time]
      properties:
        status:
          type: string
          const: ok
        time:
          type: string
          format: date-time
