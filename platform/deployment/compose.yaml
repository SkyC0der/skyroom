name: skyroom

services:
  api:
    build:
      context: ../..
      dockerfile: platform/containers/api.Dockerfile
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      WEB_ORIGIN: ${WEB_ORIGIN:-https://rooms.studioeco.co}
      AUTH_HASH_SECRET: ${AUTH_HASH_SECRET:?AUTH_HASH_SECRET must be set}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      SMTP_ADDR: ${SMTP_ADDR:?SMTP_ADDR must be set}
      EMAIL_FROM: ${EMAIL_FROM:-hello@rooms.studioeco.co}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      - api
    environment:
      API_ADDRESS: ${API_ADDRESS:-api.rooms.studioeco.co}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
