services:
  api:
    build:
      context: ../..
      dockerfile: platform/containers/api.Dockerfile
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      WEB_ORIGIN: https://${SITE_ADDRESS:-rooms.studioeco.co}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true

  caddy:
    build:
      context: ../..
      dockerfile: platform/containers/caddy.Dockerfile
    depends_on:
      - api
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-rooms.studioeco.co}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
