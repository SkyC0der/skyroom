services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: skyroom
      POSTGRES_USER: skyroom
      POSTGRES_PASSWORD: skyroom-local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyroom -d skyroom"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - skyroom-postgres:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  skyroom-postgres:
