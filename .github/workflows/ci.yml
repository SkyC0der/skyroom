name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: skyroom_test
          POSTGRES_USER: skyroom
          POSTGRES_PASSWORD: skyroom-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skyroom -d skyroom_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SKYROOM_TEST_DATABASE_URL: postgres://skyroom:skyroom-ci@localhost:5432/skyroom_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./cmd/... ./internal/...
      - run: go vet ./cmd/... ./internal/...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:web
